name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (compile all Python sources)
        run: |
          python -m py_compile openclaw_main.py
          find core scripts -name "*.py" -print0 | xargs -0 -r python -m py_compile
